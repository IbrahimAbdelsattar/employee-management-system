<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 838" width="1280" height="838" direction="ltr" style="direction: ltr;" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#4F46E5"/>
    </marker>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5" fill="none" stroke="#475569" stroke-width="1.6"/>
    </marker>
    <marker id="arrow-inherit" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1.5 L 10 6 L 1 10.5 z" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.6"/>
    </marker>
    <marker id="diamond-comp" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="10" markerHeight="8" orient="auto">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="#0F172A" stroke="#0F172A" stroke-width="1.2"/>
    </marker>
    <marker id="diamond-agg" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="10" markerHeight="8" orient="auto">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.4"/>
    </marker>
    <linearGradient id="hdr-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="indigo-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
  </defs>

  <!-- Outer Canvas Card -->
  <rect x="0" y="0" width="1280" height="838" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Top Title Banner -->
  <rect x="0" y="0" width="1280" height="64" rx="14" fill="url(#hdr-grad)"/>
  <rect x="0" y="48" width="1280" height="16" fill="url(#hdr-grad)"/>
  <text x="28" y="30" text-anchor="start" fill="#FFFFFF" font-size="17" font-weight="700">4.5 UML Sequence Diagram — Leave Request Submission &amp; Manager Approval</text>
  <text x="28" y="50" text-anchor="start" fill="#94A3B8" font-size="12" font-family="monospace">Lifelines: Employee, DeptManager, LeavePage UI, LeaveController (server.ts), DomainRulesService (rules.ts), PostgreSQL</text>
  <rect x="1105" y="18" width="148" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="1179" y="36" text-anchor="middle" fill="#38BDF8" font-size="11" font-weight="700" font-family="monospace">OMG UML 2.5 · NexaHR</text>

  
    <line x1="115" y1="138" x2="115" y2="803" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="6,4"/>
    <rect x="27" y="86" width="176" height="48" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.8"/>
    <text x="115" y="106" text-anchor="middle" fill="#4F46E5" font-size="10" font-family="monospace" font-weight="700">«actor»</text>
    <text x="115" y="123" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="700">:Employee</text>
    <rect x="109" y="150" width="12" height="588" rx="3" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
    
    <line x1="315" y1="138" x2="315" y2="803" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="6,4"/>
    <rect x="227" y="86" width="176" height="48" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.8"/>
    <text x="315" y="106" text-anchor="middle" fill="#4F46E5" font-size="10" font-family="monospace" font-weight="700">«actor»</text>
    <text x="315" y="123" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="700">:DeptManager</text>
    <rect x="309" y="150" width="12" height="588" rx="3" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
    
    <line x1="520" y1="138" x2="520" y2="803" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="6,4"/>
    <rect x="432" y="86" width="176" height="48" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8"/>
    <text x="520" y="106" text-anchor="middle" fill="#4F46E5" font-size="10" font-family="monospace" font-weight="700">«boundary»</text>
    <text x="520" y="123" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="700">:LeavePageUI</text>
    <rect x="514" y="150" width="12" height="588" rx="3" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
    
    <line x1="740" y1="138" x2="740" y2="803" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="6,4"/>
    <rect x="652" y="86" width="176" height="48" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.8"/>
    <text x="740" y="106" text-anchor="middle" fill="#4F46E5" font-size="10" font-family="monospace" font-weight="700">«control»</text>
    <text x="740" y="123" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="700">:LeaveController</text>
    <rect x="734" y="150" width="12" height="588" rx="3" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
    
    <line x1="960" y1="138" x2="960" y2="803" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="6,4"/>
    <rect x="872" y="86" width="176" height="48" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.8"/>
    <text x="960" y="106" text-anchor="middle" fill="#4F46E5" font-size="10" font-family="monospace" font-weight="700">«service»</text>
    <text x="960" y="123" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="700">:DomainRules</text>
    <rect x="954" y="150" width="12" height="588" rx="3" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
    
    <line x1="1165" y1="138" x2="1165" y2="803" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="6,4"/>
    <rect x="1077" y="86" width="176" height="48" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8"/>
    <text x="1165" y="106" text-anchor="middle" fill="#4F46E5" font-size="10" font-family="monospace" font-weight="700">«database»</text>
    <text x="1165" y="123" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="700">:PostgreSQL</text>
    <rect x="1159" y="150" width="12" height="588" rx="3" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
    
    <rect x="42" y="143" width="1196" height="350" rx="6" fill="none" stroke="#4F46E5" stroke-width="1.6" stroke-dasharray="4,2"/>
    <polygon points="42,143 125,143 125,157 115,165 42,165" fill="#4F46E5"/>
    <text x="80" y="158" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700" font-family="monospace">alt</text>
    <text x="138" y="158" fill="#1E1B4B" font-size="11" font-weight="700" font-family="monospace">[Phase 1: Leave Submission &amp; Working-Day Validation]</text>
    
    <rect x="42" y="479" width="1196" height="266" rx="6" fill="none" stroke="#4F46E5" stroke-width="1.6" stroke-dasharray="4,2"/>
    <polygon points="42,479 125,479 125,493 115,501 42,501" fill="#4F46E5"/>
    <text x="80" y="494" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700" font-family="monospace">alt</text>
    <text x="138" y="494" fill="#1E1B4B" font-size="11" font-weight="700" font-family="monospace">[Phase 2: Manager Approval &amp; Entitlement Transition]</text>
    
    <line x1="121" y1="179" x2="514" y2="179" stroke="#1E293B" stroke-width="1.8" marker-end="url(#arrow-solid)"/>
    <rect x="152.5" y="160" width="330" height="16" rx="3" fill="#F8FAFC" opacity="0.92"/>
    <text x="317.5" y="172" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="600" font-family="monospace">1. submitLeaveForm(typeId, start, end, reason)</text>
    
    <line x1="526" y1="221" x2="734" y2="221" stroke="#1E293B" stroke-width="1.8" marker-end="url(#arrow-solid)"/>
    <rect x="465" y="202" width="330" height="16" rx="3" fill="#F8FAFC" opacity="0.92"/>
    <text x="630" y="214" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="600" font-family="monospace">2. POST /api/leave/requests</text>
    
    <line x1="746" y1="263" x2="1159" y2="263" stroke="#1E293B" stroke-width="1.8" marker-end="url(#arrow-solid)"/>
    <rect x="787.5" y="244" width="330" height="16" rx="3" fill="#F8FAFC" opacity="0.92"/>
    <text x="952.5" y="256" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="600" font-family="monospace">3. SELECT public_holidays, organization_settings</text>
    
    <line x1="746" y1="305" x2="954" y2="305" stroke="#1E293B" stroke-width="1.8" marker-end="url(#arrow-solid)"/>
    <rect x="685" y="286" width="330" height="16" rx="3" fill="#F8FAFC" opacity="0.92"/>
    <text x="850" y="298" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="600" font-family="monospace">4. calculateWorkingLeaveDays(start, end, holidays)</text>
    
    <line x1="954" y1="347" x2="746" y2="347" stroke="#059669" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrow-open)"/>
    <rect x="685" y="328" width="330" height="16" rx="3" fill="#F8FAFC" opacity="0.92"/>
    <text x="850" y="340" text-anchor="middle" fill="#047857" font-size="11" font-weight="600" font-family="monospace">5. workingDays = 4 (Fri/Sat excluded)</text>
    
    <line x1="746" y1="389" x2="954" y2="389" stroke="#1E293B" stroke-width="1.8" marker-end="url(#arrow-solid)"/>
    <rect x="685" y="370" width="330" height="16" rx="3" fill="#F8FAFC" opacity="0.92"/>
    <text x="850" y="382" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="600" font-family="monospace">6. doDateRangesOverlap() &amp; applyLeaveBalanceTransition(SUBMIT)</text>
    
    <line x1="746" y1="431" x2="1159" y2="431" stroke="#1E293B" stroke-width="1.8" marker-end="url(#arrow-solid)"/>
    <rect x="787.5" y="412" width="330" height="16" rx="3" fill="#F8FAFC" opacity="0.92"/>
    <text x="952.5" y="424" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="600" font-family="monospace">7. UPDATE leave_entitlements + INSERT leave_requests (PENDING)</text>
    
    <line x1="734" y1="473" x2="526" y2="473" stroke="#059669" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrow-open)"/>
    <rect x="465" y="454" width="330" height="16" rx="3" fill="#F8FAFC" opacity="0.92"/>
    <text x="630" y="466" text-anchor="middle" fill="#047857" font-size="11" font-weight="600" font-family="monospace">8. HTTP 201 Created (pending_days reserved)</text>
    
    <line x1="321" y1="515" x2="514" y2="515" stroke="#1E293B" stroke-width="1.8" marker-end="url(#arrow-solid)"/>
    <rect x="252.5" y="496" width="330" height="16" rx="3" fill="#F8FAFC" opacity="0.92"/>
    <text x="417.5" y="508" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="600" font-family="monospace">9. clickApproveLeave(requestId, comment)</text>
    
    <line x1="526" y1="557" x2="734" y2="557" stroke="#1E293B" stroke-width="1.8" marker-end="url(#arrow-solid)"/>
    <rect x="465" y="538" width="330" height="16" rx="3" fill="#F8FAFC" opacity="0.92"/>
    <text x="630" y="550" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="600" font-family="monospace">10. PATCH /api/leave/requests/:id/decision</text>
    
    <line x1="746" y1="599" x2="954" y2="599" stroke="#1E293B" stroke-width="1.8" marker-end="url(#arrow-solid)"/>
    <rect x="685" y="580" width="330" height="16" rx="3" fill="#F8FAFC" opacity="0.92"/>
    <text x="850" y="592" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="600" font-family="monospace">11. canApproveLeaveForEmployee(actor, employee)</text>
    
    <line x1="954" y1="641" x2="746" y2="641" stroke="#059669" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrow-open)"/>
    <rect x="685" y="622" width="330" height="16" rx="3" fill="#F8FAFC" opacity="0.92"/>
    <text x="850" y="634" text-anchor="middle" fill="#047857" font-size="11" font-weight="600" font-family="monospace">12. authorized = true &amp; applyLeaveBalanceTransition(APPROVE)</text>
    
    <line x1="746" y1="683" x2="1159" y2="683" stroke="#1E293B" stroke-width="1.8" marker-end="url(#arrow-solid)"/>
    <rect x="787.5" y="664" width="330" height="16" rx="3" fill="#F8FAFC" opacity="0.92"/>
    <text x="952.5" y="676" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="600" font-family="monospace">13. UPDATE leave_entitlements (used_days) &amp; status = APPROVED</text>
    
    <line x1="734" y1="725" x2="526" y2="725" stroke="#059669" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrow-open)"/>
    <rect x="465" y="706" width="330" height="16" rx="3" fill="#F8FAFC" opacity="0.92"/>
    <text x="630" y="718" text-anchor="middle" fill="#047857" font-size="11" font-weight="600" font-family="monospace">14. HTTP 200 OK + Notification Dispatched</text>
    
</svg>