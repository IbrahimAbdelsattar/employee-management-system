  <text x="28" y="30" text-anchor="start" fill="#FFFFFF" font-size="17" font-weight="700">4.6 UML Sequence Diagram — Employee Creation &amp; Automated Multi-Table Provisioning</text>
  <text x="28" y="50" text-anchor="start" fill="#94A3B8" font-size="12" font-family="monospace">Transactional Provisioning across employees, leave_entitlements, compensation_records, onboarding_checklists &amp; audit_logs</text>
